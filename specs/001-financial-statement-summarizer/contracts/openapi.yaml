openapi: 3.1.0
info:
  title: Financial Statement Summarizer API
  version: 1.0.0
  description: |
    V1 analyzes one public, text-based annual-report PDF per request. The model receives only
    selected report pages. The response is grounded in the uploaded report; no outside data or
    investment advice is included.
servers:
  - url: http://127.0.0.1:8000
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness
      description: Does not invoke the model or inspect an API key.
      responses:
        '200':
          description: The HTTP service is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /summarise:
    post:
      operationId: summariseAnnualReport
      summary: Summarise one annual-report PDF
      description: |
        Accept exactly one PDF in multipart field `file`. The implementation rejects uploads
        over 25 MiB and PDFs with more than 1,200 pages. Scanned/image-only documents are not
        processed with OCR. At most two model invocations are made per report; number-verification
        failure returns a warning and does not cause a retry.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: One text-based public annual-report PDF.
      responses:
        '200':
          description: Summary, five ratios, report-stated risks, and warnings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
        '400':
          description: The upload is not a valid PDF or more than one file was supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: Upload is over the byte/page limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: The PDF contains no readable text or the request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '502':
          description: The configured model provider failed or returned invalid structured data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Model credentials or provider configuration are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    SummaryResponse:
      type: object
      additionalProperties: false
      required:
        - summary
        - ratios
        - risks
        - warnings
      properties:
        summary:
          type: string
          description: At most 350 words; business overview, supported trends, events, and outlook.
        ratios:
          type: array
          minItems: 5
          maxItems: 5
          description: Exactly five ratios in the order defined by the feature data model.
          items:
            $ref: '#/components/schemas/RatioResult'
        risks:
          type: array
          items:
            $ref: '#/components/schemas/RiskDisclosure'
        warnings:
          type: array
          items:
            type: string
    RatioResult:
      type: object
      additionalProperties: false
      required:
        - name
        - formula
        - inputs
        - available
        - result
        - result_unit
        - unavailable_reason
        - explanation
      properties:
        name:
          type: string
          enum:
            - current_ratio
            - debt_to_equity
            - net_profit_margin
            - return_on_equity
            - operating_margin
        formula:
          type: string
          description: Deterministic formula used by Python.
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ReportInput'
        available:
          type: boolean
        result:
          anyOf:
            - type: string
              pattern: '^-?[0-9]+\\.[0-9]{2}$'
            - type: 'null'
          description: Decimal result string rounded to two places, or null if unavailable.
        result_unit:
          type: string
          enum:
            - multiple
            - percent
        unavailable_reason:
          anyOf:
            - type: string
            - type: 'null'
        explanation:
          type: string
          description: Plain-English explanation grounded in the report and calculated result.
    ReportInput:
      type: object
      additionalProperties: false
      required:
        - label
        - reported_value
        - unit
        - period
        - page_number
        - source_quote
      properties:
        label:
          type: string
          description: Report line-item label.
        reported_value:
          type: string
          description: Value exactly as displayed in the report, retaining its scale.
        unit:
          anyOf:
            - type: string
            - type: 'null'
        period:
          type: string
        page_number:
          type: integer
          minimum: 1
          description: 1-based physical PDF page number.
        source_quote:
          type: string
          description: Short supporting excerpt from the referenced page.
    RiskDisclosure:
      type: object
      additionalProperties: false
      required:
        - description
        - evidence
      properties:
        description:
          type: string
          description: Risk stated by the uploaded report; no added outside risk or advice.
        evidence:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReportEvidence'
    ReportEvidence:
      type: object
      additionalProperties: false
      required:
        - page_number
        - source_quote
      properties:
        page_number:
          type: integer
          minimum: 1
          description: 1-based physical PDF page number.
        source_quote:
          type: string
          description: Short supporting excerpt from the referenced page.
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - invalid_pdf
                - multiple_files
                - upload_too_large
                - too_many_pages
                - unreadable_pdf
                - analysis_failed
                - model_not_configured
                - invalid_request
            message:
              type: string
              description: Safe display message. For unreadable_pdf, use the exact mandated text.
